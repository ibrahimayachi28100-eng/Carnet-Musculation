<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{
    --bg:#131517; --panel:#1c1f23; --panel2:#23272c; --line:#2e333a;
    --ink:#f2f0ec; --ink-dim:#9aa1a9; --ink-faint:#6b7178;
    --forge:#ff7a18;        /* fer chaud : accent principal */
    --forge-soft:#3a2410;
    --done:#5fb37a;         /* validé (rappel des en-têtes verts de ton carnet) */
    --done-soft:#1d2c22;
    --radius:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-feature-settings:"tnum" 1; -webkit-font-smoothing:antialiased;
    padding:0 0 90px; max-width:520px; margin:0 auto; min-height:100vh;
  }
  .num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
  /* ---- top bar ---- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(19,21,23,.86);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:14px 18px 12px; display:flex; align-items:center; gap:12px;
  }
  header .back{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel); color:var(--ink); font-size:20px; display:none;
    align-items:center;justify-content:center;flex:0 0 auto
  }
  header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px;line-height:1.1}
  header .date{font-size:12px;color:var(--ink-dim);margin-top:2px;text-transform:capitalize}
  header .gear{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:18px;display:none;align-items:center;justify-content:center;flex:0 0 auto}
  header .plus{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink-dim);font-size:22px;font-weight:600;display:none;align-items:center;justify-content:center;flex:0 0 auto;margin-right:8px}
  header .plus:active{background:var(--forge);color:#10130f}
  .prev{font-size:11px;color:var(--ink-faint);padding:6px 0 2px}
  /* ---- séance group ---- */
  .wrap{padding:14px 14px 0}
  .group{margin-bottom:18px}
  .group-h{
    display:flex;align-items:center;
    padding:4px 6px 10px;
  }
  .group-toggle{
    display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;
    font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    color:var(--done); user-select:none;
  }
  .group-title-block{display:flex;flex-direction:row;align-items:center;gap:6px;flex:1;flex-wrap:wrap}
  .last-date{font-size:10px;color:var(--ink-faint);font-weight:500;letter-spacing:.04em;text-transform:none}
  .group-h .tick{font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.04em;text-transform:none;margin-left:auto}
  .drag-handle{color:var(--ink-faint);font-size:20px;flex:0 0 auto;padding:0 4px;cursor:grab;touch-action:none}
  .drag-handle-g{color:var(--ink-faint);font-size:16px;flex:0 0 auto;padding:0 6px 0 2px;cursor:grab;touch-action:none;opacity:0.5}
  .row.dragging{opacity:.45;background:var(--panel2)}
  /* ---- exercise row (home) ---- */
  .row{
    display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:14px 15px; margin-bottom:9px;
  }
  .row:active{background:var(--panel2)}
  .row .meta{flex:1;min-width:0}
  .row .nm{font-size:15.5px;font-weight:650;line-height:1.15}
  .row .tg{font-size:13px;color:var(--ink-dim);margin-top:3px;font-variant-numeric:tabular-nums}
  .row .tg b{color:var(--forge);font-weight:750}
  .row .chev{color:var(--ink-faint);font-size:20px;flex:0 0 auto}
  .row.is-done{border-color:var(--done-soft)}
  .row.is-done .dot{background:var(--done)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--forge);flex:0 0 auto;box-shadow:0 0 0 4px var(--forge-soft)}
  .row.is-done .dot{box-shadow:0 0 0 4px var(--done-soft)}
  .addrow{display:flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:9px;color:var(--ink-dim);font-size:14px;font-weight:600}
  .addrow:active{background:var(--panel)}
  .reset{text-align:center;color:var(--ink-faint);font-size:12px;padding:24px 0 8px}
  .reset:active{color:#c0606a}
  .deload-row{display:flex;gap:8px;margin-top:12px}
  .btn.deload{flex:1;background:transparent;border:1px solid #3a6080;color:#6ab4dd;font-size:13px;font-weight:650;padding:14px 8px}
  .btn.recycle{flex:1;background:transparent;border:1px solid #3a3226;color:#c0926a;font-size:13px;font-weight:650;padding:14px 8px}
  .group-edit{color:var(--ink-faint);font-size:13px;padding:2px 4px;margin-left:4px;opacity:0.6}
  .group-edit:active{opacity:1;color:var(--forge)}
  .group-name-input{background:var(--panel2);border:1px solid var(--forge);color:var(--ink);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;width:180px;letter-spacing:.08em;text-transform:uppercase}
  .group-actions{display:flex;gap:6px;padding:0 6px 10px}
  .btn-ga{flex:1;padding:10px 6px;border-radius:10px;border:1px solid var(--line);font-size:12px;font-weight:650}
  .btn-ga.save{background:var(--forge);color:#10130f;border-color:var(--forge)}
  .btn-ga.del{background:transparent;color:#c0606a;border-color:#3a2226}
  .btn-ga.cancel{background:transparent;color:var(--ink-dim)}
  .addgroup{display:flex;align-items:center;justify-content:center;border:1px dashed var(--forge-soft);border-radius:14px;padding:16px;margin:4px 0 18px;color:var(--forge);font-size:14px;font-weight:650;opacity:0.7}
  .addgroup:active{opacity:1;background:var(--forge-soft)}
  .hero-pr{margin-top:10px;font-size:12px;color:#e0b34a;font-weight:650;font-variant-numeric:tabular-nums}
  .pr-star{font-size:11px}
  .io-row{display:flex;gap:8px;margin:14px 0 4px}
  .io-btn{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:12px;padding:13px 8px;font-size:13px;font-weight:600}
  .io-btn:active{background:var(--panel)}
  .io-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:18px}
  .io-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:480px;width:100%}
  .io-card h3{margin:0 0 8px;font-size:15px}
  .io-note{font-size:12px;color:var(--ink-dim);margin:0 0 12px;line-height:1.4}
  .io-text{width:100%;height:120px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;font-size:11px;font-family:monospace;resize:none}
  .io-actions{margin-top:12px}
  .io-actions .btn{margin-top:8px}
  /* ---- detail ---- */
  .detail{padding:16px 16px 0}
  .hero{
    background:linear-gradient(165deg,var(--panel2),var(--panel));
    border:1px solid var(--line); border-radius:var(--radius);
    padding:20px 18px; text-align:center; position:relative; overflow:hidden;
  }
  .hero .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700}
  .hero .big{font-size:40px;font-weight:820;letter-spacing:-1px;margin:8px 0 2px;line-height:1;color:var(--ink)}
  .hero .big b{color:var(--forge)}
  .hero .sub{font-size:14px;color:var(--ink-dim);margin-top:6px;min-height:18px}
  .hero.flash{animation:flash .5s ease}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(95,179,122,0)}40%{box-shadow:0 0 0 3px rgba(95,179,122,.7) inset}100%{box-shadow:0 0 0 0 rgba(95,179,122,0)}}
  .cta{
    display:flex;gap:10px;margin-top:14px;
  }
  .btn{
    flex:1;border:none;border-radius:14px;padding:17px 10px;font-size:16px;font-weight:750;
    color:#10130f; background:var(--forge); letter-spacing:.02em;
  }
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line);flex:0 0 auto;width:62px;font-size:14px}
  .btn.full{width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-weight:600}
  .btn.done{background:var(--done);color:#0c160f}
  /* adjust panel */
  .adj{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .adj h3{margin:0 0 10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
  .field{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
  .field:last-of-type{border-bottom:none}
  .field span{font-size:14px;color:var(--ink-dim)}
  .stepper{display:flex;align-items:center;gap:0}
  .stepper button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:22px;font-weight:600}
  .stepper button:active{background:var(--forge);color:#10130f}
  .stepper .val{min-width:76px;text-align:center;font-size:19px;font-weight:750;font-variant-numeric:tabular-nums}
  .stepper input.val{width:80px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--ink);outline:none;padding:8px 4px}
  .stepper input.val:focus{border-color:var(--forge)}
  .rpe{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .rpe button{flex:1;min-width:38px;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink-dim);display:flex;flex-direction:column;align-items:center;gap:1px}
  .rpe button.on{background:var(--forge);color:#10130f;border-color:var(--forge)}
  .rpe .rpe-v{font-size:13px;font-weight:700}
  .rpe .rpe-r{font-size:10px;opacity:0.7;font-weight:600}
  .rpe button.on .rpe-r{opacity:0.85}
  .e1rm-label{font-size:9px;opacity:0.6;font-weight:500;margin-left:2px}
  .ps-session{margin-top:4px;display:flex;flex-direction:column;gap:8px}
  .ps-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:10px 12px;transition:border-color .2s}
  .ps-row.done{border-color:var(--done);background:var(--done-soft)}
  .ps-n{font-size:13px;font-weight:800;color:var(--ink-dim);width:26px;flex-shrink:0}
  .ps-row.done .ps-n{color:var(--done)}
  .ps-steppers{display:flex;gap:8px;flex:1;justify-content:center}
  .ps-step{display:flex;align-items:center;gap:6px}
  .ps-step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ps-step button:active{background:var(--forge);color:#10130f}
  .ps-val{display:flex;flex-direction:column;align-items:center;min-width:38px;line-height:1.1}
  .ps-val b{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .ps-val span{font-size:9px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em}
  .ps-check{width:54px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink-faint);font-size:11px;font-weight:700;flex-shrink:0}
  .ps-check.on{background:var(--done);color:#0c160f;border-color:var(--done);font-size:18px}
  .ps-rpe-wrap{margin-top:6px}
  .btn.dim{opacity:.55}
  /* history */
  .sec-title{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin:22px 4px 10px}
  .chart{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px 8px}
  .chart .cap{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);padding:0 2px}
  .chart-head{font-size:13px;color:var(--ink-dim);font-weight:600;margin:-2px 0 8px;font-variant-numeric:tabular-nums}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px;font-size:10px;color:var(--ink-faint)}
  .chart-legend span{display:flex;align-items:center;gap:5px}
  .chart-legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
  .hist{margin-top:10px}
  .cycle-block{margin-bottom:10px}
  .cycle-head{display:flex;align-items:center;gap:8px;padding:11px 13px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;cursor:pointer;user-select:none}
  .cycle-arr{font-size:13px;color:var(--ink-faint)}
  .cycle-name{font-size:13px;font-weight:700;color:var(--ink)}
  .cycle-count{margin-left:auto;font-size:11px;color:var(--ink-faint);font-weight:600}
  .cycle-block .hist{margin-top:7px;padding-left:6px}
  .hrow{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:7px}
  .hrow .hd{font-size:12px;color:var(--ink-faint);width:58px;flex:0 0 auto;text-transform:capitalize}
  .hrow .hp{flex:1;font-size:14px;font-variant-numeric:tabular-nums}
  .hrow .he{font-size:12px;color:var(--forge);font-weight:700;font-variant-numeric:tabular-nums}
  .hrow .hr{font-size:11px;color:var(--ink-faint);width:30px;text-align:right}
  .empty{color:var(--ink-faint);font-size:13px;text-align:center;padding:24px 10px}
  .edit-link{display:block;text-align:center;color:var(--ink-faint);font-size:13px;padding:18px 0 4px;text-decoration:underline}
  /* settings inputs */
  .iline{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}
  .iline label{font-size:14px;color:var(--ink-dim)}
  .iline input,.iline select{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:15px;width:120px;text-align:right;font-variant-numeric:tabular-nums}
  .iline select{width:160px;text-align:left}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--done);color:#0c160f;padding:12px 20px;border-radius:30px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

<header>
  <button class="back" id="back" onclick="go('home')">‹</button>
  <div style="flex:1">
    <h1 id="title">Carnet de force</h1>
    <div class="date" id="hdate"></div>
  </div>
  <button class="plus" id="plus" onclick="plusClick()">+</button>
  <button class="gear" id="gear" onclick="gearClick()">⚙</button>
</header>

<div id="view"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STOCKAGE PERSISTANT (window.storage en artefact ; localStorage en standalone ; mémoire en dernier recours)
   ============================================================ */
const KEY = "carnet:state:v4";
const mem = {};
const store = {
  async get(){
    try{ if(window.storage){ const r = await window.storage.get(KEY); return r? JSON.parse(r.value):null; } }catch(e){}
    try{ const v = localStorage.getItem(KEY); return v? JSON.parse(v):null; }catch(e){}
    return mem[KEY]? JSON.parse(mem[KEY]):null;
  },
  async set(obj){
    const v = JSON.stringify(obj); mem[KEY]=v;
    try{ if(window.storage){ await window.storage.set(KEY, v); return; } }catch(e){}
    try{ localStorage.setItem(KEY, v); }catch(e){}
  }
};

/* ============================================================
   DONNÉES PAR DÉFAUT — noms d'exercices uniquement, valeurs neutres à régler.
   scheme:
     "reps"      -> séries fixes, reps montent jusqu'à repMax (+1/sem) puis +charge
     "migration" -> une série migre par semaine. migBy="weight" (charge monte) ou "reps" (reps montent)
     "free"      -> simple validation
   ============================================================ */
function convertSchemes(S){
  // Convertit tous les exercices reps/migration en série par série (perset)
  S.groups.forEach(g=>{
    g.ex.forEach(e=>{
      if(e.scheme==="perset" || e.scheme==="free") return;
      const sets = e.sets||4;
      if(e.scheme==="reps"){
        e.psMode="reps";
        e.repMin=e.repMin||8; e.repMax=e.repMax||20; e.inc=e.inc||2;
        const w=e.weight||0, rt=Math.min(e.repMax, e.currentReps||e.repMin);
        e.series=Array.from({length:sets},()=>({weight:w, repTarget:rt}));
      } else {
        e.psMode="migration";
        e.prescribedReps=e.migFix||10; e.inc=e.inc||2.5;
        const base=e.migBase||0, at=Math.min(e.migSetsAtNext||0, sets), next=round(base+(e.inc||2.5));
        e.series=Array.from({length:sets},(_,i)=>({weight: i<at?next:base, repTarget:e.prescribedReps}));
      }
      e.scheme="perset"; e.migBy=null;
    });
  });
  return S;
}
function defaults(){
  // reps simple : 4x10, charge 0 (= à régler / PdC)
  const R=(name)=>({id:uid(),name,scheme:"reps",sets:4,repMin:8,repMax:20,weight:0,inc:2,currentReps:10,history:[]});
  // migration sur la CHARGE (type développé couché)
  const MW=(name,base,reps,inc)=>({id:uid(),name,scheme:"migration",migBy:"weight",sets:4,inc:inc,migSetsAtNext:0,migBase:base,migFix:reps,history:[]});
  // migration sur les REPS (type dips lestés)
  const MR=(name,baseReps,leste,inc)=>({id:uid(),name,scheme:"migration",migBy:"reps",sets:4,inc:inc,migSetsAtNext:0,migBase:baseReps,migFix:leste,history:[]});
  const F=(name)=>({id:uid(),name,scheme:"free",sets:4,history:[]});
  return {
    view:"home", current:null,
    groups:[
      {name:"Triceps / Biceps", ex:[
        MW("Dips", 10, 10, 2.5),
        R("Traction"),
        F("Poulie abdos"),
        R("Curl 45°"),
        R("Curl Spider 45°"),
        R("Avant-bras (poignets)"),
      ]},
      {name:"Jambes", ex:[
        MW("Front squat", 60, 8, 5),
        R("Hip thrust"),
        R("Ischio (leg curl)"),
        R("Mollets"),
      ]},
      {name:"Pectoraux / Dos", ex:[
        MW("Développé couché", 100, 10, 2.5),
        MW("Développé décliné", 90, 10, 2.5),
        R("Machine pec"),
        R("Traction (dos)"),
        R("Tirage haltère"),
        R("Tirage poulie"),
        F("Lombaire"),
      ]},
      {name:"Triceps / Biceps (2)", ex:[
        MW("Dips", 10, 10, 2.5),
        R("Magic triceps"),
        R("Poulie triceps"),
        R("Curl 45°"),
        R("Curl Spider 45°"),
        R("Avant-bras (poignets)"),
      ]},
    ]
  };
}

/* ============================================================
   UTILITAIRES
   ============================================================ */
let S=null, adjState=null, confirmReset=false, psSession=null, psForceNew=false;
function uid(){return Math.random().toString(36).slice(2,9)}
function fmt(n){ if(n==null) return ""; return (Math.round(n*100)/100).toString(); }
function round(n){ return Math.round(n*100)/100; }
function today(){ return new Date().toISOString().slice(0,10); }
function frDate(iso){ const d=iso?new Date(iso+"T12:00"):new Date(); return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short'}); }
function e1rm(w,reps){ if(!w) return reps; return w*(1+reps/30); }
function save(){ store.set(S); }
function savePsSession(){ if(psSession) store.set({...S, _psSession:psSession, _psForceNew:psForceNew}); }
function findEx(id){ for(const g of S.groups) for(const e of g.ex) if(e.id===id) return [e,g]; return [null,null]; }
function esc(s){ return (s+"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function migNextVal(e){ return round(e.migBase + e.inc); }

/* ---- cible affichée ---- */
function targetText(e){
  if(e.scheme==="free") return "À valider";
  if(e.scheme==="perset"){ return e.series&&e.series.length? persetText(e.series).replace(/(\d+)×(\d+)/g,'$1×<b>$2</b>') : "À configurer"; }
  if(e.scheme==="reps"){
    const w = e.weight? ` @ <b>${fmt(e.weight)}</b>kg` : "";
    return `${e.sets}×<b>${e.currentReps}</b>${w}`;
  }
  // migration
  const at=e.migSetsAtNext||0, low=e.sets-at, base=e.migBase, next=migNextVal(e);
  if(e.migBy==="reps"){
    const w = e.migFix? ` @ ${fmt(e.migFix)}kg` : " PdC";
    if(at<=0) return `${e.sets}×<b>${base}</b>${w}`;
    let p=[`${at}×<b>${next}</b>`]; if(low>0) p.push(`${low}×${base}`);
    return p.join(" + ")+w;
  } else {
    if(at<=0) return `${e.sets}×${e.migFix} @ <b>${fmt(base)}</b>kg`;
    let p=[`${at}×${e.migFix} @ <b>${fmt(next)}</b>kg`]; if(low>0) p.push(`${low}×${e.migFix} @ ${fmt(base)}kg`);
    return p.join(" + ");
  }
}
function targetPlain(e){ return targetText(e).replace(/<\/?b>/g,""); }
function targetTopWeight(e){
  if(e.scheme==="reps") return e.weight;
  if(e.scheme==="perset") return persetTopWP(e).weight;
  if(e.scheme==="migration"){ if(e.migBy==="reps") return e.migFix; return (e.migSetsAtNext>0)? migNextVal(e) : e.migBase; }
  return 0;
}
function targetTopReps(e){
  if(e.scheme==="reps") return e.currentReps;
  if(e.scheme==="perset") return persetTopWP(e).reps || e.prescribedReps || 10;
  if(e.scheme==="migration"){ if(e.migBy==="reps") return (e.migSetsAtNext>0)? migNextVal(e) : e.migBase; return e.migFix; }
  return 0;
}

function loggedToday(e){ const h=e.history; return h.length && h[h.length-1].date===today(); }

/* ============================================================
   MOTEUR DE PROGRESSION
   ============================================================ */
function validate(e, p, rpe){   // p: {sets, reps, weight}
  if(e.cycle==null) e.cycle=1;
  if(e.cycleSess==null) e.cycleSess=0;
  const snap = snapshot(e);   // capture l'état AVANT toute modification
  e.cycleSess++;
  // Détection record perso : charge jamais atteinte à reps >= cette rep
  let isPR=false;
  if(p.weight>0 || p.reps>0){
    let prevBest=0;
    for(const h of e.history){
      if(h.recycle||h.deload) continue;
      // un record antérieur "couvre" cette perf si charge ET reps >= la nouvelle
      if((h.weight||0) >= p.weight && (h.reps||0) >= p.reps) prevBest=1;
    }
    if(!prevBest && e.history.some(h=>!h.recycle&&!h.deload)) isPR=true;
  }
  e.history.push({
    date: today(), scheme:e.scheme, migBy:e.migBy||null,
    sets:p.sets, reps:p.reps, weight:p.weight, rpe:rpe||null,
    e1rm: round(e1rm(p.weight, p.reps)),
    text: sessionText(e,p),
    cycle:e.cycle, cycleSess:e.cycleSess, pr:isPR,
    prev: snap
  });
  if(isPR) setTimeout(()=>toast("⭐ Record perso !"),200);
  if(e.scheme==="reps"){
    if(p.reps>=e.repMax){ e.weight=round(p.weight+e.inc); e.currentReps=e.repMin; }
    else { e.weight=p.weight; e.currentReps=Math.min(e.repMax, p.reps+1); }
  } else if(e.scheme==="migration"){
    e.migSetsAtNext=(e.migSetsAtNext||0)+1;
    if(e.migSetsAtNext>=e.sets){ e.migBase=round(e.migBase+e.inc); e.migSetsAtNext=0; }
  }
  save();
}
/* ===== MODE SÉRIE PAR SÉRIE (perset) ===== */
function persetComputeNext(e, achieved){
  if(e.psMode==="reps") return persetNextReps(e, achieved);
  return persetNextMigration(e, achieved);
}
function persetNextMigration(e, achieved){
  const P = e.prescribedReps;
  const next = achieved.map((a)=>{
    let rt = (a.reps >= P) ? P : Math.min(P, a.reps + 1);
    return {weight:a.weight, repTarget:rt};
  });
  const allFull = achieved.every(a=>a.reps >= P);
  // Si toutes les séries passent leurs reps, une série de plus monte d'un cran —
  // que tu aies poussé manuellement ou non. Donc faire 2 séries à 12 → 3 à 12 la fois suivante.
  if(allFull){
    const minW = Math.min(...next.map(s=>s.weight));
    const idx = next.findIndex(s=>s.weight===minW);
    next[idx] = {weight: round(minW + e.inc), repTarget: P};
  }
  return next;
}
function persetNextReps(e, achieved){
  const repMin=e.repMin, repMax=e.repMax, inc=e.inc;
  const reps = achieved.map(a=>a.reps);
  const minR = Math.min(...reps), maxR = Math.max(...reps);
  const homogeneous = (minR === maxR);
  let target;
  if(homogeneous){
    // toutes les séries au même nombre → le palier avance depuis ce que tu as FAIT
    if(minR >= repMax){
      // plafond atteint → +charge, retour aux reps mini
      return achieved.map(a=>({weight: round(a.weight+inc), repTarget: repMin}));
    }
    target = minR + 1;
  } else {
    // séries inégales → la cible reste le haut atteint, tu grattes le retard (toi, pas l'app)
    target = Math.min(maxR, repMax);
  }
  return achieved.map(a=>({weight:a.weight, repTarget:target}));
}
function persetTopWP(e){
  // série la plus lourde (pour 1RM/PR) parmi les cibles actuelles
  let w=0,r=0; (e.series||[]).forEach(s=>{ if(s.weight>w||(s.weight===w&&s.repTarget>r)){w=s.weight;r=s.repTarget;} });
  return {weight:w, reps:r};
}
function persetText(series){
  // regroupe les séries identiques : "2×10 @ 12kg + 2×10 @ 10kg"
  const groups=[];
  series.forEach(s=>{
    const key=`${s.repTarget}@${s.weight}`;
    const g=groups.find(x=>x.key===key);
    if(g) g.n++; else groups.push({key, n:1, reps:s.repTarget, weight:s.weight});
  });
  return groups.map(g=>{
    const w = g.weight>0 ? ` @ ${fmt(g.weight)}kg` : " PdC";
    return `${g.n}×${g.reps}${w}`;
  }).join(" + ");
}
function persetFinish(e, achieved, rpe){
  if(e.cycle==null) e.cycle=1;
  if(e.cycleSess==null) e.cycleSess=0;
  const snap = snapshot(e);
  e.cycleSess++;
  const top = {weight:0, reps:0};
  achieved.forEach(a=>{ if(a.weight>top.weight||(a.weight===top.weight&&a.reps>top.reps)){top.weight=a.weight;top.reps=a.reps;} });
  // PR : charge×reps jamais atteinte
  let isPR=false;
  let covered=false, hadReal=false;
  for(const h of e.history){
    if(h.recycle||h.deload) continue; hadReal=true;
    if((h.weight||0)>=top.weight && (h.reps||0)>=top.reps) covered=true;
  }
  if(hadReal && !covered && (top.weight>0||top.reps>0)) isPR=true;
  e.history.push({
    date:today(), scheme:"perset",
    sets:achieved.length, reps:top.reps, weight:top.weight, rpe:rpe||null,
    e1rm: round(e1rm(top.weight, top.reps)),
    text: persetText(achieved.map(a=>({repTarget:a.reps, weight:a.weight}))),
    detail: achieved.map(a=>({reps:a.reps,weight:a.weight})),
    cycle:e.cycle, cycleSess:e.cycleSess, pr:isPR, prev:snap
  });
  if(isPR) setTimeout(()=>toast("⭐ Record perso !"),200);
  e.series = persetComputeNext(e, achieved);
  save();
}

function sessionText(e,p){
  if(e.scheme==="free") return "Fait";
  if(e.scheme==="reps"){ const w=p.weight? ` @ ${fmt(p.weight)}kg`:""; return `${p.sets}×${p.reps}${w}`; }
  const at=Math.min(e.migSetsAtNext||0,p.sets), low=p.sets-at, base=e.migBase, next=migNextVal(e);
  if(e.migBy==="reps"){
    const w=e.migFix? ` @ ${fmt(e.migFix)}kg`:" PdC"; let parts=[];
    if(at>0) parts.push(`${at}×${next}`); if(low>0) parts.push(`${low}×${base}`); if(!parts.length) parts.push(`${p.sets}×${base}`);
    return parts.join(" + ")+w;
  } else {
    let parts=[];
    if(at>0) parts.push(`${at}×${e.migFix} @ ${fmt(next)}kg`); if(low>0) parts.push(`${low}×${e.migFix} @ ${fmt(base)}kg`); if(!parts.length) parts.push(`${p.sets}×${e.migFix} @ ${fmt(base)}kg`);
    return parts.join(" + ");
  }
}
function snapshot(e){ return {sets:e.sets,weight:e.weight,currentReps:e.currentReps,migBase:e.migBase,migFix:e.migFix,migSetsAtNext:e.migSetsAtNext,cycle:e.cycle,cycleSess:e.cycleSess,series:e.series?JSON.parse(JSON.stringify(e.series)):null}; }
function undoLast(e){
  const last=e.history.pop(); if(!last) return; const p=last.prev||{};
  if(p.sets!=null) e.sets=p.sets;
  if(p.cycle!=null) e.cycle=p.cycle;
  if(p.cycleSess!=null) e.cycleSess=p.cycleSess;
  if(e.scheme==="reps"){ e.weight=p.weight; e.currentReps=p.currentReps; }
  else if(e.scheme==="migration"){ e.migBase=p.migBase; e.migFix=p.migFix; e.migSetsAtNext=p.migSetsAtNext; }
  else if(e.scheme==="perset"){ if(p.series) e.series=JSON.parse(JSON.stringify(p.series)); }
  save();
}

const V=document.getElementById('view');
function go(view,id){
  // Si on quitte un exercice perset en cours (séries non terminées), on sauvegarde psSession
  if(S.view==='ex' && psSession && !psSession.rows.every(r=>r.done)){
    S._psSession = psSession;
    S._psForceNew = psForceNew;
  }
  // Reset psSession seulement si on change d'exercice ou si l'exercice est terminé
  if(view!=='ex' || id!==S.current){
    // on ne reset que si on change d'exercice
    if(id!==S.current) psSession=null;
  }
  psForceNew=false;
  S.view=view; S.current=id||null;
  // Restaurer psSession si on revient sur le même exercice avec une session en cours
  if(view==='ex' && id && S._psSession && S._psSession.exId===id && S._psSession.date===today()){
    psSession = S._psSession;
    psForceNew = S._psForceNew||false;
  }
  save(); render(); window.scrollTo(0,0);
}

function deleteGroup(gi){

/* ---- drag-to-reorder ---- */
let dragG={active:false};
function startDragGroup(ev,gi){
  ev.stopPropagation(); ev.preventDefault();
  const el=document.getElementById("grp_"+gi); if(!el) return;
  const rect=el.getBoundingClientRect();
  const startY=(ev.touches?ev.touches[0].clientY:ev.clientY);
  dragG={active:true,gi,el,startY,origY:rect.top,origIdx:gi};
  el.classList.add("dragging");
  window.addEventListener("pointermove",onDragGroupMove,{passive:false});
  window.addEventListener("pointerup",onDragGroupEnd);
}
function onDragGroupMove(ev){
  if(!dragG.active) return; ev.preventDefault();
  const y=(ev.touches?ev.touches[0].clientY:ev.clientY);
  dragG.dy=y-dragG.startY;
  dragG.el.style.transform=`translateY(${dragG.dy}px)`;
}
function onDragGroupEnd(){
  if(!dragG.active) return;
  dragG.el.classList.remove("dragging"); dragG.el.style.transform="";
  window.removeEventListener("pointermove",onDragGroupMove);
  window.removeEventListener("pointerup",onDragGroupEnd);
  const fromIdx=dragG.origIdx;
  const grpEls=S.groups.map((g,i)=>document.getElementById("grp_"+i)).filter(Boolean);
  const dropY=dragG.origY+(dragG.dy||0)+dragG.el.offsetHeight/2;
  let toIdx=fromIdx;
  grpEls.forEach((r,i)=>{
    const mid=r.getBoundingClientRect().top+r.offsetHeight/2;
    if((dragG.dy||0)>0 && dropY>mid) toIdx=i;
    if((dragG.dy||0)<0 && dropY<mid && i<toIdx) toIdx=i;
  });
  if(toIdx!==fromIdx){const[item]=S.groups.splice(fromIdx,1);S.groups.splice(toIdx,0,item);save();}
  dragG.active=false; renderHome();
}
function startDrag(ev,id,gi){
  ev.stopPropagation(); ev.preventDefault();
  const el=document.getElementById("row_"+id); if(!el) return;
  const rect=el.getBoundingClientRect();
  const startY=(ev.touches?ev.touches[0].clientY:ev.clientY);
  drag={active:true,id,gi,el,startY,origY:rect.top,origIdx:S.groups[gi].ex.findIndex(x=>x.id===id)};
  el.classList.add("dragging");
  window.addEventListener("pointermove",onDragMove,{passive:false});
  window.addEventListener("pointerup",onDragEnd);
}
function onDragMove(ev){
  if(!drag.active) return; ev.preventDefault();
  const y=(ev.touches?ev.touches[0].clientY:ev.clientY);
  drag.dy=y-drag.startY;
  drag.el.style.transform=`translateY(${drag.dy}px)`;
}
function onDragEnd(){
  if(!drag.active) return;
  drag.el.classList.remove("dragging"); drag.el.style.transform="";
  window.removeEventListener("pointermove",onDragMove);
  window.removeEventListener("pointerup",onDragEnd);
  const g=S.groups[drag.gi]; if(!g){drag.active=false;return;}
  const fromIdx=drag.origIdx;
  const wrap=document.querySelector(".wrap");
  const rowEls=g.ex.map(e=>document.getElementById("row_"+e.id)).filter(Boolean);
  const dropY=drag.origY+drag.dy+drag.el.offsetHeight/2;
  let toIdx=fromIdx;
  rowEls.forEach((r,i)=>{
    const mid=r.getBoundingClientRect().top+r.offsetHeight/2;
    if(drag.dy>0 && dropY>mid) toIdx=i;
    if(drag.dy<0 && dropY<mid && i<toIdx) toIdx=i;
  });
  if(toIdx!==fromIdx){const[item]=g.ex.splice(fromIdx,1);g.ex.splice(toIdx,0,item);save();}
  drag.active=false; renderHome();
}

function persetSessionHTML(e){
  if(!psSession || psSession.exId!==e.id){
    // Restaurer depuis S si disponible et du jour
    if(S._psSession && S._psSession.exId===e.id && S._psSession.date===today()){
      psSession = S._psSession;
    } else {
      psSession={exId:e.id, date:today(), rows:(e.series||[]).map(s=>({reps:s.repTarget, weight:s.weight, done:false})), rpe:null};
      S._psSession = psSession; S._psForceNew = false;
      save();
    }
  }
  const rows = psSession.rows.map((r,i)=>`
    <div class="ps-row ${r.done?'done':''}">
      <div class="ps-n">S${i+1}</div>
      <div class="ps-steppers">
        <div class="ps-step">
          <button onclick="psStep(${i},'reps',-1)">−</button>

      <button class="ps-check ${r.done?'on':''}" onclick="psToggle(${i})">${r.done?'✓':'valider'}</button>
    </div>`).join('');
  const allDone = psSession.rows.length>0 && psSession.rows.every(r=>r.done);
  const rmap={5:"+5",6:"+4",7:"+3","7.5":"+2",8:"+2","8.5":"+1",9:"+1","9.5":"½",10:"0"};
  const rpeBtns=[5,6,7,8,8.5,9,9.5,10].map(v=>
    `<button class="${psSession.rpe===v?'on':''}" onclick="psRpe(${v})"><span class="rpe-v">${v}</span><span class="rpe-r">${rmap[v]}</span></button>`).join('');
  return `<div class="ps-session">

      <span class="rpe-legend">Effort sur ta série la plus dure (reps en réserve)</span>

    </div>
    <button class="btn full done ${allDone?'':'dim'}" onclick="psFinish('${e.id}')">${allDone?'Terminer l\'exercice':'Terminer l\'exercice (valide tes séries)'}</button>
  </div>`;
}
function psStep(i, field, delta){
  const [e]=findEx(psSession.exId); if(!e) return;
  const r=psSession.rows[i]; if(!r) return;
  if(field==='reps') r.reps=Math.max(0, r.reps+delta);
  else { const step=e.inc||2.5; r.weight=Math.max(0, round(r.weight+delta*step)); }
  S._psSession=psSession; save();
  renderEx();
}
function psToggle(i){ const r=psSession.rows[i]; if(r){ r.done=!r.done; S._psSession=psSession; save(); } renderEx(); }
function psRpe(v){ psSession.rpe=(psSession.rpe===v?null:v); S._psSession=psSession; save(); renderEx(); }
function psNewSession(id){ psForceNew=true; psSession=null; S._psSession=null; S._psForceNew=true; save(); renderEx(); }
function psFinish(id){
  const [e]=findEx(id); if(!e) return;
  if(loggedToday(e) && !psForceNew){ toast("Déjà validé aujourd'hui"); return; }
  if(!psSession.rows.every(r=>r.done)){ toast("Valide chaque série d'abord"); return; }
  const achieved=psSession.rows.map(r=>({reps:r.reps, weight:r.weight}));
  persetFinish(e, achieved, psSession.rpe);
  psSession=null; psForceNew=false;
  S._psSession=null; S._psForceNew=false;
  save();
  renderEx();
}

function renderEx(){
  const [e]=findEx(S.current); if(!e){ go('home'); return; }
  document.getElementById('title').textContent=e.name;
  const dn=loggedToday(e);
  const hist=e.history.slice(-10);
  let html=`<div class="detail">`;
  const sessNum = (e.cycleSess||0)+1;
  const cyc = (e.scheme!=="free") ? ` &middot; Cycle ${e.cycle||1} &middot; séance ${sessNum}` : '';
  const pr = bestPR(e);
  html+=`<div class="hero" id="hero">
    <div class="lbl">${dn?'Validé · prochaine cible':'Cible du jour'}${cyc}</div>
    <div class="big">${targetText(e)}</div>
    <div class="sub">${heroSub(e,dn)}</div>
    ${pr?`<div class="hero-pr">⭐ Record : ${esc(pr)}</div>`:''}</div>`;
  if(e.scheme==="perset"){
    if(dn && !psForceNew){
      html+=`<div class="cta"><button class="btn done" disabled>✓ Séance validée</button></div>`;
    } else {
      html+=persetSessionHTML(e);
    }
  } else if(e.scheme==="free"){
    html+=`<div class="cta"><button class="btn ${dn?'done':''}" onclick="quickValidate('${e.id}')">${dn?'✓ Validé':'Valider'}</button></div>`;
  } else {
    html+=`<div class="cta">
      <button class="btn ${dn?'done':''}" onclick="quickValidate('${e.id}')">${dn?'✓ Validé':'Valider la cible'}</button>
      <button class="btn sec" onclick="openAdj('${e.id}')">Ajuster</button></div>`;
  }
  if(dn) html+=`<button class="btn ghost full" style="margin-top:8px" onclick="undoEx('${e.id}')">Annuler la dernière saisie</button>`;
  if(e.scheme!=="free"){
    html+=`<div class="deload-row">
      <button class="btn deload" onclick="doDeload('${e.id}')">Deload (-30%)</button>
      <button class="btn recycle" onclick="confirmRecycle('${e.id}')">Recycler (-20%)</button>
    </div>`;
  }
  html+=`<div id="adjPanel"></div>`;
  const realSessions = e.history.filter(h=>!h.recycle);
  let chartHtml="";
  if(realSessions.length>=2){
    const useW=realSessions.some(h=>h.weight>0);
    const isMig=(e.psMode==="migration");
    const last=realSessions[realSessions.length-1];
    let lastTxt, axisLabel;
    if(!useW){ lastTxt=`${last.sets}×${last.reps}`; axisLabel="reps"; }
    else if(isMig){ lastTxt=`${last.sets}×${last.reps} @ ${fmt(last.weight)}kg · 1RM ~ ${fmt(last.e1rm)}kg`; axisLabel="1RM estimé"; }
    else { lastTxt=`${last.sets}×${last.reps} @ ${fmt(last.weight)}kg`; axisLabel="charge × reps"; }
    chartHtml += `<div class="sec-title">Progression — ${axisLabel}</div>`;
    chartHtml += `<div class="chart-head">${lastTxt}</div>`;
    chartHtml += progressChart(e);
  }
  html+=`<div class="sec-title">Historique par cycle</div>`;
  if(!e.history.length){ html+=`<div class="empty">Rien d'enregistré. Tape <b style="color:var(--forge)">Ajuster</b> pour ta première saisie.</div>`; }
  else{
    // Grouper l'historique par numéro de cycle
    const byCycle={};
    e.history.forEach(h=>{ const c=h.cycle||1; (byCycle[c]=byCycle[c]||[]).push(h); });
    const cycles=Object.keys(byCycle).map(Number).sort((a,b)=>b-a); // plus récent d'abord
    const currentCycle = e.cycle||1;
    if(!e.openCycles) e.openCycles={};
    cycles.forEach(c=>{
      const sessions=byCycle[c];
      const isCurrent = (c===currentCycle);
      const open = isCurrent ? (e.openCycles[c]!==false) : (e.openCycles[c]===true);
      // compter les vraies séances (hors recyclage)
      const nbSess = sessions.filter(h=>!h.recycle).length;
      html+=`<div class="cycle-block">
        <div class="cycle-head" onclick="toggleCycle('${e.id}',${c})">
          <span class="cycle-arr">${open?"▾":"▸"}</span>
          <span class="cycle-name">Cycle ${c}${isCurrent?' (en cours)':''}</span>
          <span class="cycle-count">${nbSess} séance${nbSess>1?'s':''}</span>
        </div>`;
      if(open){
        html+=`<div class="hist">`;
        for(let i=sessions.length-1;i>=0;i--){ const h=sessions[i];
          const tag = h.deload ? ' style="border-color:#3a6080"' : (h.recycle ? ' style="border-color:#3a3226"' : '');
          const gi = e.history.indexOf(h);
          const rpeCell = h.rpe ? `<div class="hr num" style="color:${rpeColor(h.rpe)}">@${h.rpe}</div>` : `<div class="hr num"></div>`;
          const clickable = (!h.recycle) ? ` onclick="editHist('${e.id}',${gi})" style="cursor:pointer"` : '';
          html+=`<div class="hrow"${tag}${clickable}><div class="hd">${frDate(h.date)}</div>
            <div class="hp num">${h.pr?'<span class="pr-star">⭐</span> ':''}${esc(h.text)}</div>
            ${h.weight>0 && !h.recycle && e.psMode==="migration"?`<div class="he num">1RM ~ ${fmt(h.e1rm)} kg</div>`:''}
            ${rpeCell}</div>`;
        }
        html+=`</div>`;
      }
      html+=`</div>`;
    });
  }
  if(chartHtml) html+=chartHtml;
  html+=`<a class="edit-link" onclick="go('edit','${e.id}')">⚙ Régler / renommer cet exercice</a></div>`;
  V.innerHTML=html;
}
function rpeColor(v){ if(!v||v<5) return 'var(--ink-faint)'; if(v<7) return 'var(--done)'; if(v<9) return 'var(--forge)'; return '#e0524f'; }
function editHist(id, gi){
  const [e]=findEx(id); if(!e) return;
  const h=e.history[gi]; if(!h) return;
  const rmap={5:"+5",6:"+4",7:"+3","7.5":"+2",8:"+2","8.5":"+1",9:"+1","9.5":"½",10:"0"};
  const btns=[5,6,7,8,8.5,9,9.5,10].map(v=>
    `<button class="${h.rpe===v?'on':''}" style="${h.rpe===v?('background:'+rpeColor(v)+';border-color:'+rpeColor(v)+';color:#10130f'):''}" onclick="setHistRpe('${id}',${gi},${v})"><span class="rpe-v">${v}</span><span class="rpe-r">${rmap[v]}</span></button>`).join('');
  const overlay=document.createElement('div');
  overlay.className='io-overlay';
  overlay.innerHTML=`<div class="io-card">
    <h3>Corriger la séance</h3>
    <p class="io-note">${frDate(h.date)} &middot; ${esc(h.text)}</p>
    <span class="rpe-legend">Effort (RPE) — corrige si tu t'es trompé</span>
    <div class="rpe" style="margin-top:6px">${btns}</div>
    <div class="io-actions">
      <button class="btn ghost full" onclick="clearHistRpe('${id}',${gi})">Retirer le RPE</button>
      <button class="btn ghost full" onclick="closeIO()">Fermer</button>
    </div></div>`;
  document.body.appendChild(overlay);
}
function setHistRpe(id, gi, v){ const [e]=findEx(id); if(e&&e.history[gi]){ e.history[gi].rpe=v; save(); } closeIO(); renderEx(); }
function clearHistRpe(id, gi){ const [e]=findEx(id); if(e&&e.history[gi]){ e.history[gi].rpe=null; save(); } closeIO(); renderEx(); }
function bestPR(e){
  let best=null;
  for(const h of e.history){
    if(h.recycle||h.deload) continue;
    if(!best) { best=h; continue; }
    // meilleur = charge supérieure, ou charge égale + reps supérieures
    if((h.weight||0) > (best.weight||0) ||
       ((h.weight||0)===(best.weight||0) && (h.reps||0) > (best.reps||0))) best=h;
  }
  if(!best) return null;
  if(best.weight>0) return `${best.sets}×${best.reps} @ ${fmt(best.weight)}kg`;
  return `${best.sets}×${best.reps}`;
}
function heroSub(e,dn){
  if(e.scheme==="free") return dn?"":"Geste / gainage";
  if(e.scheme==="perset"){
    const lastRpe = e.history.length? e.history[e.history.length-1].rpe : null;
    if(dn && lastRpe && lastRpe>=9) return "RPE "+lastRpe+" — pense au Deload la semaine prochaine.";
    if(dn) return "Séance validée série par série.";
    if(e.psMode==="reps") return `Reps montent ${e.repMin}→${e.repMax}, puis +${fmt(e.inc)}kg. Valide chaque série.`;
    return `Toutes séries pleines → une série monte de +${fmt(e.inc)}kg. Valide chaque série.`;
  }
  if(e.scheme==="reps"){
    if(!e.weight && !e.history.length) return "Tape Ajuster pour fixer ta charge.";
    if(dn){
      const lastRpe = e.history.length? e.history[e.history.length-1].rpe : null;
      if(lastRpe && lastRpe >= 9) return "RPE " + lastRpe + " — pense au Deload la semaine prochaine.";
      return "Bien. À la prochaine : +1 rep.";
    }
    if(e.currentReps>=e.repMax) return `Plafond reps → +${fmt(e.inc)}kg cette semaine.`;
    return `Objectif : ${e.repMax} reps avant +${fmt(e.inc)}kg`;
  }
  // migration
  if(dn){
    const lastRpe = e.history.length? e.history[e.history.length-1].rpe : null;
    if(lastRpe && lastRpe >= 9) return "RPE " + lastRpe + " — pense au Deload la semaine prochaine.";
    return "Une série de plus migre vers le haut.";
  }
  if(e.migBy==="reps") return `On migre les reps vers ${migNextVal(e)}, une série/semaine (leste fixe).`;
  return `On migre la charge vers ${fmt(migNextVal(e))}kg, une série/semaine.`;
}

/* ---- validation ---- */
function quickValidate(id){
  const [e]=findEx(id);
  if(loggedToday(e)){ toast("Déjà validé aujourd'hui"); return; }
  const p = e.scheme==="free" ? {sets:e.sets||0,reps:0,weight:0}
          : {sets:e.sets, reps:targetTopReps(e), weight:targetTopWeight(e)};
  validate(e, p, null);
  const hero=document.getElementById('hero'); if(hero) hero.classList.add('flash');
  toast("Validé ✓"); setTimeout(()=>renderEx(),120);
}
function undoEx(id){ const [e]=findEx(id); undoLast(e); toast("Annulé"); renderEx(); }
function toggleCycle(id, c){
  const [e]=findEx(id);
  if(!e.openCycles) e.openCycles={};
  const currentCycle = e.cycle||1;
  const isCurrent = (c===currentCycle);
  const open = isCurrent ? (e.openCycles[c]!==false) : (e.openCycles[c]===true);
  e.openCycles[c] = !open;
  save(); renderEx();
}

/* ---- deload (-30%, mêmes séries/reps, migration suspendue) ---- */
function doDeload(id){
  const [e]=findEx(id);
  if(loggedToday(e)){ toast("Déjà validé aujourd'hui"); return; }
  const w = targetTopWeight(e);
  const dw = round(Math.round((w * 0.7) / 2.5) * 2.5); // -30%, arrondi au 2.5 le plus proche
  const reps = targetTopReps(e);
  if(e.cycle==null) e.cycle=1;
  if(e.cycleSess==null) e.cycleSess=0;
  const snap = snapshot(e);
  e.cycleSess++;
  // Log la séance allégée SANS faire avancer la migration
  e.history.push({
    date: today(), scheme:e.scheme, migBy:e.migBy||null,
    sets:e.sets, reps:reps, weight:dw, rpe:null,
    e1rm: round(e1rm(dw, reps)),
    text: `DELOAD ${e.sets}×${reps} @ ${fmt(dw)}kg`,
    deload: true, cycle:e.cycle, cycleSess:e.cycleSess,
    prev: snap
  });
  // On ne touche PAS à l'état de progression (migBase, series, etc.) :
  // le deload est une séance allégée journalisée, la cible reprend ensuite où elle était.
  save();
  toast("Deload enregistré"); renderEx();
}

/* ---- recyclage (-20% du max atteint, nouveau cycle) ---- */
function doRecycle(id){
  const [e]=findEx(id);
  if(loggedToday(e)){ toast("Déjà validé aujourd'hui"); return; }
  // Trouver le max poids dans l'historique
  let maxW = targetTopWeight(e);
  for(const h of e.history){ if(h.weight > maxW) maxW = h.weight; }
  const newBase = round(Math.round((maxW * 0.8) / 2.5) * 2.5); // -20%, arrondi au 2.5
  const cycleDone = e.cycle||1;
  const sessDone = e.cycleSess||0;
  // Log l'entrée de recyclage
  e.history.push({
    date: today(), scheme:e.scheme, migBy:e.migBy||null,
    sets:e.sets, reps:0, weight:maxW, rpe:null,
    e1rm: round(e1rm(maxW, targetTopReps(e))),
    text: `FIN CYCLE ${cycleDone} (${sessDone} séances) · ${fmt(maxW)} → ${fmt(newBase)}kg`,
    recycle: true, cycle:cycleDone,
    prev: snapshot(e)
  });
  // Nouveau cycle
  e.cycle = cycleDone + 1;
  e.cycleSess = 0;
  // Reset le cycle
  if(e.scheme==="migration"){
    e.migBase = newBase;
    e.migSetsAtNext = 0;
    e.sets = 4;
  } else if(e.scheme==="reps"){
    e.weight = newBase;
    e.currentReps = e.repMin;
    e.sets = 4;
  } else if(e.scheme==="perset"){
    const n = (e.series&&e.series.length)||4;
    const rt = e.psMode==="reps" ? (e.repMin||10) : (e.prescribedReps||10);
    e.series = Array.from({length:n}, ()=>({weight:newBase, repTarget:rt}));
  }
  save();
  toast("Recyclage → " + fmt(newBase) + "kg"); renderEx();
}
let recycleConfirm=null;
function confirmRecycle(id){
  if(recycleConfirm===id){ doRecycle(id); recycleConfirm=null; return; }
  recycleConfirm=id;
  toast("Tape encore pour confirmer");
  setTimeout(()=>{recycleConfirm=null;},3000);
}

/* ---- ajustement ---- */
function openAdj(id){
  const [e]=findEx(id);
  if(e.scheme==="migration") adjState={sets:e.sets, base:e.migBase, fix:e.migFix, inc:e.inc, rpe:null};
  else adjState={sets:e.sets, reps:e.currentReps, weight:e.weight, rpe:null};
  drawAdj(e);
  document.getElementById('adjPanel').scrollIntoView({behavior:'smooth',block:'center'});
}
function stepHTML(label,key,val,step,id){
  return `<div class="field"><span>${label}</span>
    <div class="stepper">
      <button onclick="adjStep('${key}',${-step},'${id}')">-</button>
      <input class="val num" inputmode="decimal" value="${fmt(val)}" onfocus="this.select()" onchange="adjSet('${key}',this.value,'${id}')">
      <button onclick="adjStep('${key}',${step},'${id}')">+</button></div></div>`;
}
function drawAdj(e){
  const p=document.getElementById('adjPanel'); if(!p) return;
  const inc=e.inc||1;   // incrément de progression (pour l'aperçu)
  const W=2.5;          // pas des boutons +/- pour les charges (disques salle)
  let fields = stepHTML("Séries réalisées","sets",adjState.sets,1,e.id);
  if(e.scheme==="reps"){
    fields += stepHTML("Reps réalisées","reps",adjState.reps,1,e.id);
    fields += stepHTML("Charge (kg, 0 = PdC)","weight",adjState.weight,W,e.id);
  } else {
    fields += stepHTML("Charge de base (kg)","base",adjState.base,W,e.id);
    fields += stepHTML("Reps / série","fix",adjState.fix,1,e.id);
    fields += stepHTML("Marche de migration (kg)","inc",adjState.inc,0.5,e.id);
    fields += `<div class="prev">Cible recalée : ${migPreview(e,adjState,adjState.inc)}</div>`;
  }
  const rpeMap={6:"+4",7:"+3","7.5":"+2",8:"+2","8.5":"+1",9:"+1","9.5":"½",10:"0"};
  const rpeBtns=[6,7,7.5,8,8.5,9,9.5,10].map(v=>
    `<button class="${adjState.rpe===v?'on':''}" onclick="adjRpe(${v},'${e.id}')">
       <span class="rpe-v">${v}</span><span class="rpe-r">${rpeMap[v]}</span>
     </button>`).join('');
  p.innerHTML=`<div class="adj"><h3>Saisie réelle</h3>${fields}
    <div class="field" style="border:none;flex-direction:column;align-items:stretch">
      <span style="margin-bottom:2px">Effort sur ta série la plus dure</span>
      <span class="rpe-legend">Chiffre du haut = RPE &middot; chiffre du bas = reps qu'il te restait en réserve</span>
      <div class="rpe">${rpeBtns}</div></div>
    <button class="btn full" style="margin-top:14px" onclick="confirmAdj('${e.id}')">Enregistrer cette séance</button>
    <div class="prev" style="text-align:center">La progression repart de ce que tu as réellement fait.</div></div>`;
}
function migPreview(e,a,step){
  const at=Math.min(e.migSetsAtNext||0,a.sets), low=a.sets-at, base=a.base, next=round(base+step);
  if(e.migBy==="reps"){ const w=a.fix?` @ ${fmt(a.fix)}kg`:" PdC";
    if(at<=0) return `${a.sets}×${base}${w}`;
    return (at>=a.sets?`${a.sets}×${next}`:`${at}×${next} + ${low}×${base}`)+w; }
  if(at<=0) return `${a.sets}×${a.fix} @ ${fmt(base)}kg`;
  return at>=a.sets?`${a.sets}×${a.fix} @ ${fmt(next)}kg`:`${at}×${a.fix} @ ${fmt(next)}kg + ${low}×${a.fix} @ ${fmt(base)}kg`;
}
function adjStep(k,d,id){ const [e]=findEx(id);
  if(k==='sets') adjState.sets=Math.max(1,adjState.sets+d);
  else if(k==='reps') adjState.reps=Math.max(0,adjState.reps+d);
  else if(k==='base') adjState.base=Math.max(0,round(adjState.base+d));
  else if(k==='fix') adjState.fix=Math.max(0,round(adjState.fix+d));
  else if(k==='inc') adjState.inc=Math.max(0.5,round(adjState.inc+d));
  else adjState.weight=Math.max(0,round(adjState.weight+d));
  drawAdj(e);
}
function adjSet(k,v,id){ const [e]=findEx(id);
  let n=parseFloat((v+"").replace(',','.')); if(isNaN(n)) n=0;
  if(k==='sets') adjState.sets=Math.max(1,Math.round(n));
  else if(k==='reps') adjState.reps=Math.max(0,Math.round(n));
  else if(k==='base') adjState.base=Math.max(0,round(n));
  else if(k==='fix') adjState.fix=Math.max(0,round(n));
  else if(k==='inc') adjState.inc=Math.max(0.5,round(n));
  else adjState.weight=Math.max(0,round(n));
  drawAdj(e);
}
function adjRpe(v,id){ const [e]=findEx(id); adjState.rpe=(adjState.rpe===v?null:v); drawAdj(e); }
function confirmAdj(id){
  const [e]=findEx(id);
  if(loggedToday(e)){ toast("Déjà validé aujourd'hui"); return; }
  e.sets=adjState.sets;
  if(e.scheme==="migration"){
    e.inc=adjState.inc;
    e.migSetsAtNext=Math.min(e.migSetsAtNext||0, e.sets);
    e.migBase=adjState.base; e.migFix=adjState.fix;
    const p = e.migBy==="reps"
      ? {sets:e.sets, reps:targetTopReps(e), weight:e.migFix}
      : {sets:e.sets, reps:e.migFix, weight:targetTopWeight(e)};
    validate(e, p, adjState.rpe);
  } else {
    validate(e, {sets:e.sets, reps:adjState.reps, weight:adjState.weight}, adjState.rpe);
  }
  toast("Enregistré ✓"); renderEx();
}

/* ---- sparkline ---- */
function progressChart(e){
  // Points = toutes les séances réelles (normales + deload), hors marqueurs recycle
  const pts = e.history.filter(h=>!h.recycle);
  const useW = pts.some(h=>h.weight>0);
  const useE1rm = (e.psMode==="migration"); // 1RM valide seulement en migration charge (reps ~fixes)
  const vals = pts.map(h=> !useW ? h.reps : (useE1rm ? h.e1rm : (h.weight*h.reps)));
  const n = vals.length;
  const min=Math.min(...vals), max=Math.max(...vals);
  const pad=(max-min)*0.12||1, lo=min-pad, hi=max+pad;
  const W=600,H=190,L=10,R=12,T=16,B=26;
  const x=i=> L + i*(W-L-R)/Math.max(1,n-1);
  const y=v=> T + (H-T-B)*(1-(v-lo)/(hi-lo));

  // Couleurs alternées par cycle
  const cyColors=["var(--forge)","#5b8fb0"]; // orange / bleu acier
  const colorFor=c=> cyColors[((c||1)-1)%2];

  // Segmenter par cycle (points consécutifs de même cycle)
  let segs=[], cur=null;
  pts.forEach((h,i)=>{
    const c=h.cycle||1;
    if(!cur||cur.cycle!==c){ cur={cycle:c, pts:[]}; segs.push(cur); }
    cur.pts.push({i, v:vals[i], h});
  });

  // Tracé de chaque segment de cycle
  let paths="";
  segs.forEach(s=>{
    if(s.pts.length<1) return;
    const d=s.pts.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
    paths+=`<path d="${d}" fill="none" stroke="${colorFor(s.cycle)}" stroke-width="${n>40?1.8:2.4}" stroke-linecap="round" stroke-linejoin="round"/>`;
  });

  // Connexion entre cycles = chute de recyclage (pointillé gris)
  let drops="";
  for(let s=1;s<segs.length;s++){
    const prev=segs[s-1].pts[segs[s-1].pts.length-1];
    const next=segs[s].pts[0];
    drops+=`<path d="M${x(prev.i).toFixed(1)} ${y(prev.v).toFixed(1)} L${x(next.i).toFixed(1)} ${y(next.v).toFixed(1)}" fill="none" stroke="var(--ink-faint)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5"/>`;
  }

  // Ligne de tendance = sommets de chaque cycle (pointillé doré)
  let trend="";
  if(segs.length>=2){
    const peaks=segs.map(s=>{ let best=s.pts[0]; s.pts.forEach(p=>{if(p.v>best.v)best=p;}); return best; });
    const d=peaks.map((p,k)=>`${k?'L':'M'}${x(p.i).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
    trend=`<path d="${d}" fill="none" stroke="#e0b34a" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.7"/>`;
  }

  // Marqueurs : deloads (bleu creux), recyclages (gros point orange), dernier point
  let marks="";
  pts.forEach((h,i)=>{
    if(h.deload){ marks+=`<circle cx="${x(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="3.5" fill="var(--bg)" stroke="#5b8fb0" stroke-width="1.8"/>`; }
  });
  // Points de début de cycle (sauf le tout premier) = juste après un recyclage
  segs.forEach((s,si)=>{ if(si>0){ const p=s.pts[0]; marks+=`<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4" fill="#e0b34a"/>`; } });
  // Dernier point en évidence
  marks+=`<circle cx="${x(n-1).toFixed(1)}" cy="${y(vals[n-1]).toFixed(1)}" r="4.5" fill="${colorFor(pts[n-1].cycle)}" stroke="var(--bg)" stroke-width="1.5"/>`;

  // Grille horizontale légère (min, milieu, max)
  const gridVals=[min, (min+max)/2, max];
  let grid="";
  gridVals.forEach(gv=>{ const yy=y(gv).toFixed(1); grid+=`<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="var(--line)" stroke-width="0.8" opacity="0.4"/><text x="${W-R}" y="${(parseFloat(yy)-3).toFixed(1)}" fill="var(--ink-faint)" font-size="9" text-anchor="end">${fmt(round(gv))}</text>`; });

  const legend = segs.length>=2
    ? `<div class="chart-legend"><span><i style="background:#e0b34a"></i>tendance (sommets)</span><span><i style="background:#e0b34a;border-radius:50%"></i>recyclage</span>${pts.some(h=>h.deload)?'<span><i style="background:transparent;border:1.5px solid #5b8fb0;border-radius:50%"></i>deload</span>':''}</div>`
    : '';

  return `<div class="chart">
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px">
      ${grid}${drops}${paths}${trend}${marks}
    </svg>
    <div class="cap"><span>${frDate(pts[0].date)}</span><span>${n} séances</span><span style="color:var(--forge)">${frDate(pts[n-1].date)}</span></div>
    ${legend}</div>`;
}

/* ---- réglages / renommage ---- */
function renderEdit(){
  const [e]=findEx(S.current); if(!e){ go('home'); return; }
  document.getElementById('title').textContent="Réglages";
  const typ = e.scheme==="free"?"free" : (e.psMode==="reps"?"perset_reps":"perset_mig");
  let html=`<div class="detail"><div class="adj">`;
  html+=`<div class="iline"><label>Nom</label><input id="f_name" value="${esc(e.name)}" style="width:180px;text-align:left"></div>`;
  html+=`<div class="iline"><label>Progression</label>
    <select id="f_type" onchange="changeType('${e.id}')">
      <option value="perset_mig" ${typ==='perset_mig'?'selected':''}>Série/série · migration charge</option>
      <option value="perset_reps" ${typ==='perset_reps'?'selected':''}>Série/série · reps montantes</option>
      <option value="free" ${typ==='free'?'selected':''}>Simple</option>
    </select></div>`;
  if(typ==="perset_mig"){
    html+=iline("Séries","f_sets",e.sets);
    html+=iline("Reps cible / série","f_preps",e.prescribedReps);
    html+=iline("Charge de base (kg, 0 = PdC)","f_base",persetTopWP(e).weight||0);
    html+=iline("Incrément charge (kg)","f_inc",e.inc);
    html+=`<div class="prev">Quand les ${e.sets||4} séries passent leurs ${e.prescribedReps||10} reps, une série monte d'un cran (charge). Modifier « charge de base » réinitialise les séries.</div>`;
  } else if(typ==="perset_reps"){
    html+=iline("Séries","f_sets",e.sets);
    html+=iline("Reps mini (après +charge)","f_repMin",e.repMin);
    html+=iline("Reps maxi (avant +charge)","f_repMax",e.repMax);
    html+=iline("Charge de base (kg, 0 = PdC)","f_base",persetTopWP(e).weight||0);
    html+=iline("Incrément charge (kg)","f_inc",e.inc);
    html+=`<div class="prev">Les reps montent ${e.repMin||10}→${e.repMax||20} sur toutes les séries. Au plafond, +charge et retour à ${e.repMin||10}. Modifier « charge de base » réinitialise les séries.</div>`;
  }
  html+=`<button class="btn full" style="margin-top:14px" onclick="saveEdit('${e.id}')">Enregistrer</button>
    <button class="btn ghost full" style="margin-top:8px" onclick="go('ex','${e.id}')">Annuler</button>
    <button class="btn ghost full" style="margin-top:8px;color:#c0606a;border-color:#3a2226" onclick="delEx('${e.id}')">Supprimer cet exercice</button>
  </div></div>`;
  V.innerHTML=html;
}
function iline(label,id,val){ return `<div class="iline"><label>${label}</label><input id="${id}" type="number" inputmode="decimal" value="${val??0}"></div>`; }
function gv(id){ const el=document.getElementById(id); return el?parseFloat(el.value):undefined; }
function changeType(id){
  const [e]=findEx(id); const t=document.getElementById('f_type').value;
  const name=document.getElementById('f_name').value;
  const base = targetTopWeight(e)||0;
  if(t==="perset_mig"){
    e.scheme="perset"; e.psMode="migration"; e.migBy=null;
    e.sets=e.sets||4; e.prescribedReps=e.prescribedReps||10; e.inc=e.inc||2.5;
    if(!e.series||!e.series.length) e.series=Array.from({length:e.sets},()=>({weight:base, repTarget:e.prescribedReps}));
  }
  else if(t==="perset_reps"){
    e.scheme="perset"; e.psMode="reps"; e.migBy=null;
    e.sets=e.sets||4; e.repMin=e.repMin||10; e.repMax=e.repMax||20; e.inc=e.inc||2;
    if(!e.series||!e.series.length) e.series=Array.from({length:e.sets},()=>({weight:base, repTarget:e.repMin}));
  }
  else { e.scheme="free"; e.psMode=null; e.migBy=null; }
  e.name=name||e.name; renderEdit();
}
function saveEdit(id){
  const [e]=findEx(id); const t=document.getElementById('f_type').value;
  e.name=document.getElementById('f_name').value||e.name;
  if(t==="perset_mig" || t==="perset_reps"){
    e.scheme="perset"; e.migBy=null;
    const newSets=Math.max(1,Math.round(gv('f_sets')||4));
    e.inc=gv('f_inc')||2.5;
    const base=gv('f_base'); const prevBase=persetTopWP(e).weight||0;
    let resetRep;
    if(t==="perset_mig"){ e.psMode="migration"; e.prescribedReps=Math.max(1,Math.round(gv('f_preps')||10)); resetRep=e.prescribedReps; }
    else { e.psMode="reps"; e.repMin=Math.max(1,Math.round(gv('f_repMin')||10)); e.repMax=Math.max(e.repMin,Math.round(gv('f_repMax')||20)); resetRep=e.repMin; }
    // Réinitialiser les séries si nombre changé, base changée, ou pas encore de séries
    if(!e.series || e.series.length!==newSets || (base!=null && base!==prevBase)){
      e.series=Array.from({length:newSets},()=>({weight:base||0, repTarget:resetRep}));
    }
    e.sets=newSets;
  }
  else { e.scheme="free"; e.psMode=null; e.migBy=null; e.sets=4; }
  save(); toast("Enregistré"); go('ex',id);
}
function delEx(id){ for(const g of S.groups){ const i=g.ex.findIndex(x=>x.id===id); if(i>=0){ g.ex.splice(i,1); break; } } save(); go('home'); }
function addEx(gi){ const e={id:uid(),name:"Nouvel exercice",scheme:"perset",psMode:"reps",sets:4,repMin:10,repMax:20,inc:2,series:Array.from({length:4},()=>({weight:0,repTarget:10})),history:[]}; S.groups[gi].ex.push(e); save(); go('edit',e.id); }
function resetAll(){
  if(!confirmReset){ confirmReset=true; renderHome(); setTimeout(()=>{confirmReset=false; if(S.view==='home') renderHome();},4000); return; }
  confirmReset=false; S=convertSchemes(defaults()); save(); go('home');
}
function exportData(){
  const data = JSON.stringify({groups:S.groups});
  // Tenter le presse-papier, sinon afficher dans une zone à copier
  navigator.clipboard?.writeText(data).then(
    ()=>toast("Données copiées ✓ — colle-les dans une note"),
    ()=>showIO("export", data)
  ) || showIO("export", data);
}
function importData(){ showIO("import", ""); }
function showIO(mode, data){
  const overlay=document.createElement('div');
  overlay.className='io-overlay';
  overlay.innerHTML=`<div class="io-card">
    <h3>${mode==="export"?"Exporter":"Importer"}</h3>
    <p class="io-note">${mode==="export"
      ? "Copie tout ce texte et garde-le (note, mail). Pour restaurer : Importer sur le nouveau téléphone."
      : "Colle ici le texte exporté, puis Importer. ⚠ Ça remplace tes données actuelles."}</p>
    <textarea class="io-text" id="ioText" ${mode==="export"?"readonly":""}>${mode==="export"?esc(data):""}</textarea>
    <div class="io-actions">
      ${mode==="import"?`<button class="btn full" onclick="doImport()">Importer (remplacer)</button>`:`<button class="btn full" onclick="copyIO()">Copier</button>`}
      <button class="btn ghost full" onclick="closeIO()">Fermer</button>
    </div></div>`;
  document.body.appendChild(overlay);
  if(mode==="export"){ const t=document.getElementById('ioText'); t.focus(); t.select(); }
}
function copyIO(){ const t=document.getElementById('ioText'); t.select(); try{document.execCommand('copy');toast("Copié ✓");}catch(e){toast("Sélectionne et copie manuellement");} }
function closeIO(){ const o=document.querySelector('.io-overlay'); if(o) o.remove(); }
function doImport(){
  const t=document.getElementById('ioText'); if(!t) return;
  try{
    const obj=JSON.parse(t.value.trim());
    if(!obj.groups || !Array.isArray(obj.groups)) throw new Error("format");
    S.groups=obj.groups; S.collapsed={}; S.editingGroup=null;
    save(); closeIO(); go('home'); toast("Données importées ✓");
  }catch(e){ toast("Texte invalide — vérifie le copier-coller"); }
}

/* ============================================================ BOOT ============================================================ */
(async function(){
  S = await store.get();
  if(!S || !S.groups){ S = defaults(); await store.set(S); }
  // Restaurer psSession si une session en cours existe du jour
  if(S._psSession && S._psSession.date===today()){
    psSession = S._psSession;
    psForceNew = S._psForceNew||false;
  } else {
    S._psSession=null; S._psForceNew=false;
  }
  S.view="home"; S.current=null; if(S.editingGroup==null) S.editingGroup=null;
  // Nettoyer les anciens noms "Séance N · Xxx" → garder juste "Xxx"
  S.groups.forEach(g=>{
    g.name = g.name.replace(/^S[eé]ance\s*\d+\s*[·\-·]\s*/i,'').trim();
    if(!g.name) g.name = "Séance";
  });
  // Conversion : tous les exercices reps/migration passent en série par série
  convertSchemes(S);
  save(); render();
})();

</script>
